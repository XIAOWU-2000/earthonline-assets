<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800">
  <title>劫怪部件库 · 可组合系统</title>
  <desc>6 类部件自由组合 → 理论 11,520 种形态。用于批量产出劫怪，保持画风统一。</desc>

  <defs>
    <filter id="p" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="900" height="800" fill="#F7F5F0"/>
  <text x="26" y="38" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#1A1A1A">劫怪部件库</text>
  <text x="26" y="60" font-family="'PingFang SC',sans-serif" font-size="12" fill="#8A8478">6 类部件自由组合 → 理论 11,520 种形态 · 每只怪 = 头型 + 体型 + 眼 + 嘴 + 肢 + 一个记忆点配件</text>

  <!-- ══════ ROW 1: 头型 + 体型 ══════ -->
  <g filter="url(#p)">
    <text x="26" y="88" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="600" fill="#5A5142">A · 头型 ×4</text>
    <g transform="translate(26,98)">
      <g fill="#FFFFFF" stroke="#0A0A0A" stroke-width="5" stroke-linejoin="round">
        <!-- 圆钝 -->
        <path d="M14 0 C 30 0, 42 12, 42 28 C 42 46, 30 58, 14 58 C -2 58, -14 46, -14 28 C -14 12, -2 0, 14 0 Z" transform="translate(14,0)"/>
        <!-- 尖锐 -->
        <path d="M0 44 L18 0 L36 44 L18 58 Z" transform="translate(96,0)"/>
        <!-- 方正 -->
        <rect x="150" y="0" width="44" height="58" rx="5"/>
        <!-- 不规则 -->
        <path d="M216 4 C 244 -6, 268 10, 262 32 C 258 50, 232 62, 220 52 C 206 42, 210 22, 216 4 Z"/>
      </g>
    </g>
    <g font-family="monospace" font-size="8" fill="#8A8478">
      <text x="66" y="176">A1 圆钝</text><text x="152" y="176">A2 尖锐</text>
      <text x="238" y="176">A3 方正</text><text x="330" y="176">A4 不规则</text>
    </g>

    <text x="440" y="88" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="600" fill="#5A5142">B · 体型 ×4</text>
    <g transform="translate(440,98)">
      <g fill="#FFFFFF" stroke="#0A0A0A" stroke-width="5" stroke-linejoin="round">
        <!-- 球状 -->
        <ellipse cx="26" cy="30" rx="26" ry="30"/>
        <!-- 锥状 -->
        <path d="M78 60 L104 0 L130 60 Z"/>
        <!-- 块状 -->
        <rect x="150" y="0" width="52" height="60" rx="6"/>
        <!-- 瘫软 -->
        <path d="M216 24 C 236 4, 272 10, 272 34 C 272 54, 244 66, 226 58 C 208 50, 202 38, 216 24 Z"/>
      </g>
    </g>
    <g font-family="monospace" font-size="8" fill="#8A8478">
      <text x="476" y="176">B1 球状</text><text x="562" y="176">B2 锥状</text>
      <text x="648" y="176">B3 块状</text><text x="736" y="176">B4 瘫软</text>
    </g>
  </g>

  <!-- ══════ ROW 2: 眼睛 ×6 ══════ -->
  <text x="26" y="210" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="600" fill="#5A5142">C · 眼 ×6（决定性格，最关键的部件）</text>
  <g filter="url(#p)" transform="translate(26,222)">
    <g stroke="#0A0A0A" stroke-width="4.5" stroke-linejoin="round">
      <!-- C1 圆眼（天真/正常） -->
      <g transform="translate(30,30)">
        <circle cx="-16" cy="0" r="15" fill="#F5F0DC"/><circle cx="16" cy="0" r="15" fill="#F5F0DC"/>
        <circle cx="-16" cy="2" r="5.5" fill="#0A0A0A"/><circle cx="16" cy="2" r="5.5" fill="#0A0A0A"/>
      </g>
      <!-- C2 铜钱眼（贪） -->
      <g transform="translate(110,30)">
        <circle cx="-16" cy="0" r="15" fill="#F5F0DC"/><circle cx="16" cy="0" r="15" fill="#F5F0DC"/>
        <rect x="-21" y="-5" width="10" height="10" fill="#0A0A0A"/><rect x="11" y="-5" width="10" height="10" fill="#0A0A0A"/>
      </g>
      <!-- C3 眯缝（无力/疲惫） -->
      <g transform="translate(190,30)" fill="none" stroke-width="5.5" stroke-linecap="round">
        <path d="M-30 -4 C -22 -12, -8 -12, -2 -4"/><path d="M2 -4 C 8 -12, 22 -12, 30 -4"/>
        <path d="M-16 0 L-16 6" stroke-width="4"/><path d="M16 0 L16 6" stroke-width="4"/>
      </g>
      <!-- C4 三角眼（凶狠） -->
      <g transform="translate(270,30)">
        <path d="M-32 -8 L-4 2 L-26 12 Z" fill="#F5F0DC"/><path d="M32 -8 L4 2 L26 12 Z" fill="#F5F0DC"/>
        <circle cx="-18" cy="2" r="4.5" fill="#D93025"/><circle cx="18" cy="2" r="4.5" fill="#D93025"/>
      </g>
      <!-- C5 大小眼（怪诞） -->
      <g transform="translate(350,30)">
        <circle cx="-18" cy="-2" r="19" fill="#F5F0DC"/><circle cx="16" cy="4" r="10" fill="#F5F0DC"/>
        <circle cx="-18" cy="2" r="6" fill="#0A0A0A"/><circle cx="16" cy="5" r="4" fill="#0A0A0A"/>
      </g>
      <!-- C6 闭眼（哀伤/放下） -->
      <g transform="translate(430,30)" fill="none" stroke-width="5.5" stroke-linecap="round">
        <path d="M-30 -2 C -22 -12, -8 -12, -2 -2"/><path d="M2 -2 C 8 -12, 22 -12, 30 -2"/>
        <path d="M-28 5 C -20 11, -10 11, -4 5" stroke-width="2.6" opacity="0.6"/>
        <path d="M4 5 C 10 11, 20 11, 28 5" stroke-width="2.6" opacity="0.6"/>
      </g>
    </g>
  </g>
  <g font-family="monospace" font-size="8" fill="#8A8478">
    <text x="42" y="290">C1 圆眼</text><text x="122" y="290">C2 铜钱</text><text x="202" y="290">C3 眯缝</text>
    <text x="282" y="290">C4 三角</text><text x="360" y="290">C5 大小眼</text><text x="440" y="290">C6 闭眼</text>
  </g>

  <!-- ══════ ROW 3: 嘴 ×5 ══════ -->
  <text x="26" y="324" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="600" fill="#5A5142">D · 嘴 ×5</text>
  <g filter="url(#p)" transform="translate(26,336)">
    <g stroke="#0A0A0A" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
      <!-- D1 锯齿尖牙 -->
      <g transform="translate(40,26)">
        <path d="M-28 -6 C -14 8, 14 8, 28 -6 C 22 20, -22 20, -28 -6 Z" fill="#3A1410"/>
        <path d="M-16 -2 L-9 14 L-2 -2 M4 -2 L11 14 L18 -2" fill="#F5F0DC" stroke-width="2.4"/>
      </g>
      <!-- D2 波浪（犹豫） -->
      <path d="M96 14 C 108 6, 118 24, 130 16 C 138 10, 146 20, 154 14" fill="none" stroke-width="5.5"/>
      <!-- D3 下垂（丧） -->
      <path d="M198 12 C 210 22, 230 22, 242 12" fill="none" stroke-width="5.5"/>
      <path d="M206 18 C 216 26, 226 26, 234 18" fill="none" stroke-width="2.8" opacity="0.6"/>
      <!-- D4 O 型（惊） -->
      <ellipse cx="310" cy="18" rx="14" ry="17" fill="#3A1410"/>
      <!-- D5 轻闭（平静） -->
      <path d="M382 18 C 392 12, 404 12, 414 18" fill="none" stroke-width="5"/>
    </g>
  </g>
  <g font-family="monospace" font-size="8" fill="#8A8478">
    <text x="46" y="396">D1 尖牙</text><text x="124" y="396">D2 波浪</text><text x="208" y="396">D3 下垂</text>
    <text x="292" y="396">D4 O型</text><text x="378" y="396">D5 轻闭</text>
  </g>

  <!-- ══════ ROW 4: 肢 ×4 ══════ -->
  <text x="26" y="430" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="600" fill="#5A5142">E · 肢 ×4</text>
  <g filter="url(#p)" transform="translate(26,442)">
    <g stroke="#0A0A0A" stroke-width="6" fill="none" stroke-linecap="round">
      <!-- E1 细长爪 -->
      <g transform="translate(50,30)">
        <path d="M-30 -10 C -46 -4, -52 12, -44 26"/>
        <path d="M30 -10 C 46 -4, 52 12, 44 26"/>
        <path d="M-44 26 l-12 -4 M-44 26 l-4 -12 M44 26 l12 -4 M44 26 l4 -12" stroke-width="4"/>
      </g>
      <!-- E2 短粗 -->
      <g transform="translate(180,30)">
        <path d="M-28 -8 C -44 -2, -46 16, -38 26"/>
        <path d="M28 -8 C 44 -2, 46 16, 38 26"/>
      </g>
      <!-- E3 锁链（被束缚） -->
      <g transform="translate(310,30)">
        <path d="M-30 -6 C -48 2, -52 20, -42 32"/>
        <path d="M30 -6 C 48 2, 52 20, 42 32"/>
        <ellipse cx="-46" cy="8" rx="8" ry="5" stroke-width="4"/><ellipse cx="-44" cy="24" rx="8" ry="5" stroke-width="4"/>
        <ellipse cx="46" cy="8" rx="8" ry="5" stroke-width="4"/><ellipse cx="44" cy="24" rx="8" ry="5" stroke-width="4"/>
      </g>
      <!-- E4 无肢（飘浮） -->
      <g transform="translate(430,26)" opacity="0.55">
        <path d="M-26 4 C -38 10, -40 22, -34 30"/>
        <path d="M26 4 C 38 10, 40 22, 34 30"/>
      </g>
    </g>
  </g>
  <g font-family="monospace" font-size="8" fill="#8A8478">
    <text x="56" y="506">E1 细爪</text><text x="176" y="506">E2 短粗</text><text x="296" y="506">E3 锁链</text><text x="412" y="506">E4 飘浮</text>
  </g>

  <!-- ══════ ROW 5: 记忆点配件 ×6 ══════ -->
  <text x="26" y="540" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="600" fill="#5A5142">F · 记忆点配件 ×6（每只怪只选一个，这是辨识度的来源）</text>
  <g filter="url(#p)" transform="translate(26,552)">
    <g stroke="#0A0A0A" stroke-width="4.5" stroke-linejoin="round">
      <!-- F1 双角 -->
      <g transform="translate(44,26)" fill="#C8B8A0">
        <path d="M-22 22 C -32 4, -20 -10, -8 -2"/><path d="M22 22 C 32 4, 20 -10, 8 -2"/>
      </g>
      <!-- F2 蘑菇（等待） -->
      <g transform="translate(140,26)">
        <path d="M-18 24 C -26 12, -14 0, 0 2 C 12 4, 12 18, 4 24 Z" fill="#D8C8B0"/>
        <circle cx="-8" cy="10" r="2.6" fill="#0A0A0A" stroke="none" opacity="0.5"/>
        <circle cx="4" cy="7" r="2.2" fill="#0A0A0A" stroke="none" opacity="0.5"/>
      </g>
      <!-- F3 断指针时钟 -->
      <g transform="translate(230,26)" fill="#F0EDE0">
        <circle cx="0" cy="0" r="24"/>
        <path d="M0 0 L0 -16" stroke-width="4.5" fill="none" stroke-linecap="round"/>
        <path d="M0 0 L14 8" stroke-width="4.5" fill="none" stroke-linecap="round"/>
        <path d="M0 -16 L-10 -26" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="4" fill="#D93025"/>
      </g>
      <!-- F4 铜钱 -->
      <g transform="translate(320,26)" fill="#D9B45C">
        <circle cx="0" cy="0" r="22"/>
        <rect x="-7" y="-7" width="14" height="14" fill="#0A0A0A" stroke="none"/>
      </g>
      <!-- F5 消散碎片 -->
      <g transform="translate(410,26)" fill="#8FB0C4">
        <path d="M-24 -14 L-2 -18 L-6 2 L-26 -2 Z"/>
        <path d="M6 -16 L28 -14 L22 4 L2 0 Z" opacity="0.8"/>
        <path d="M-12 8 L8 6 L4 24 L-14 22 Z" opacity="0.6"/>
        <circle cx="-30" cy="18" r="4" opacity="0.5" stroke-width="3"/>
        <circle cx="26" cy="20" r="3.5" opacity="0.45" stroke-width="3"/>
      </g>
      <!-- F6 尖刺 -->
      <g transform="translate(500,26)" fill="#B85A48">
        <path d="M0 -26 L10 -2 L26 -8 L12 8 L20 26 L0 14 L-20 26 L-12 8 L-26 -8 L-10 -2 Z"/>
      </g>
    </g>
  </g>
  <g font-family="monospace" font-size="8" fill="#8A8478">
    <text x="30" y="618">F1 双角</text><text x="124" y="618">F2 蘑菇</text><text x="208" y="618">F3 断钟</text>
    <text x="298" y="618">F4 铜钱</text><text x="384" y="618">F5 消散</text><text x="474" y="618">F6 尖刺</text>
  </g>

  <!-- ══════ 组合示例 ══════ -->
  <text x="26" y="656" font-family="'PingFang SC',sans-serif" font-size="11" font-weight="600" fill="#5A5142">组合示例 · 同一组部件换一个记忆点，就是另一只怪</text>

  <g>
    <rect x="26" y="668" width="200" height="112" rx="6" fill="#FFFFFF" stroke="#DDD8CC"/>
    <text x="126" y="686" text-anchor="middle" font-family="monospace" font-size="8" fill="#5A6472">A1 + B1 + C2 + D1 + E1 + F4</text>
    <g transform="translate(126,730)" filter="url(#p)">
      <ellipse cx="0" cy="0" rx="34" ry="32" fill="#B8933F" stroke="#0A0A0A" stroke-width="5.5"/>
      <circle cx="-13" cy="-6" r="11" fill="#F5F0DC" stroke="#0A0A0A" stroke-width="4"/>
      <circle cx="13" cy="-6" r="11" fill="#F5F0DC" stroke="#0A0A0A" stroke-width="4"/>
      <rect x="-17" y="-10" width="8" height="8" fill="#0A0A0A"/>
      <rect x="9" y="-10" width="8" height="8" fill="#0A0A0A"/>
      <path d="M-14 12 C -6 20, 6 20, 14 12 C 10 24, -10 24, -14 12 Z" fill="#3A1410" stroke="#0A0A0A" stroke-width="4"/>
      <circle cx="0" cy="34" r="10" fill="#D9B45C" stroke="#0A0A0A" stroke-width="4"/>
      <rect x="-4" y="30" width="8" height="8" fill="#0A0A0A" stroke="none"/>
    </g>
    <text x="126" y="776" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="9" fill="#5A5A5A">贪狼·薪（贪财）</text>

    <rect x="240" y="668" width="200" height="112" rx="6" fill="#FFFFFF" stroke="#DDD8CC"/>
    <text x="340" y="686" text-anchor="middle" font-family="monospace" font-size="8" fill="#5A6472">A1 + B1 + C1 + D3 + E2 + F2</text>
    <g transform="translate(340,730)" filter="url(#p)">
      <ellipse cx="0" cy="0" rx="34" ry="32" fill="#8474A0" stroke="#0A0A0A" stroke-width="5.5"/>
      <circle cx="-13" cy="-6" r="10" fill="#F5F0DC" stroke="#0A0A0A" stroke-width="4"/>
      <circle cx="13" cy="-6" r="10" fill="#F5F0DC" stroke="#0A0A0A" stroke-width="4"/>
      <circle cx="-13" cy="-4" r="4" fill="#0A0A0A"/><circle cx="13" cy="-4" r="4" fill="#0A0A0A"/>
      <path d="M-12 14 C -4 22, 6 22, 12 14" fill="none" stroke="#0A0A0A" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M-20 -26 C -28 -36, -18 -44, -8 -38" fill="#D8C8B0" stroke="#0A0A0A" stroke-width="4"/>
      <circle cx="-16" cy="-38" r="2.4" fill="#0A0A0A" stroke="none" opacity="0.5"/>
    </g>
    <text x="340" y="776" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="9" fill="#5A5A5A">计都·候（等待）</text>

    <rect x="454" y="668" width="200" height="112" rx="6" fill="#FFFFFF" stroke="#DDD8CC"/>
    <text x="554" y="686" text-anchor="middle" font-family="monospace" font-size="8" fill="#5A6472">A2 + B2 + C4 + D1 + E1 + F6</text>
    <g transform="translate(554,728)" filter="url(#p)">
      <path d="M0 34 L26 -22 L0 -40 L-26 -22 Z" fill="#B85A48" stroke="#0A0A0A" stroke-width="5.5" stroke-linejoin="round"/>
      <path d="M-16 -6 L-2 4 L-14 14 Z" fill="#F5F0DC" stroke="#0A0A0A" stroke-width="4"/>
      <path d="M16 -6 L2 4 L14 14 Z" fill="#F5F0DC" stroke="#0A0A0A" stroke-width="4"/>
      <circle cx="-9" cy="3" r="3.5" fill="#D93025"/><circle cx="9" cy="3" r="3.5" fill="#D93025"/>
      <path d="M-12 22 C -4 30, 6 30, 12 22 Z" fill="#3A1410" stroke="#0A0A0A" stroke-width="4"/>
      <path d="M0 -40 L6 -54 M0 -40 L-6 -54" stroke="#0A0A0A" stroke-width="4.5" stroke-linecap="round"/>
    </g>
    <text x="554" y="776" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="9" fill="#5A5A5A">七杀·锋（对抗）</text>

    <rect x="668" y="668" width="206" height="112" rx="6" fill="#EDF3E6" stroke="#A8C48A"/>
    <text x="771" y="690" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="10" font-weight="700" fill="#3D5230">产 出 规 则</text>
    <g font-family="'PingFang SC',sans-serif" font-size="8.5" fill="#4A5D3A">
      <text x="682" y="710">1 · 先定剪影（A × B）</text>
      <text x="682" y="726">2 · 再定性格（C 眼 D 嘴）</text>
      <text x="682" y="742">3 · 最后加一个记忆点（F）</text>
      <text x="682" y="762" fill="#B03A2E">4 · 每只怪只用一个 F</text>
    </g>
  </g>
</svg>
