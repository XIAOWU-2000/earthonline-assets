<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <title>劫怪图鉴 · 尸兄画风 — 贪狼·薪 / 浑沌·怠 / 拖延兽</title>
  <desc>风格要点：极粗黑轮廓(6-10pt) · 不规则抖动线条 · 夸张变形 · 异形眼 · 局部红点缀 · 黏液</desc>

  <defs>
    <!-- 手绘抖动（尸兄风核心：线条不能是标准曲线） -->
    <filter id="zx" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="4" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="zx2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- 网点阴影（漫画感） -->
    <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#F2F0E6"/>
      <circle cx="3.5" cy="3.5" r="1.5" fill="#0A0A0A" opacity="0.28"/>
    </pattern>

    <radialGradient id="slime" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#C8DE78"/>
      <stop offset="100%" stop-color="#8FA84A"/>
    </radialGradient>
  </defs>

  <rect width="900" height="560" fill="#F7F5F0"/>

  <!-- 标题 -->
  <text x="24" y="38" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1A1A1A">劫怪图鉴</text>
  <text x="24" y="60" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#8A8478">画风参考《尸兄》：极粗黑轮廓 · 抖动线条 · 夸张变形 · 异形眼 · 局部红 · 黏液</text>

  <!-- ══════════════ 1. 贪狼·薪 ══════════════ -->
  <g transform="translate(30,80)">
    <rect x="0" y="0" width="270" height="410" fill="#FFFFFF" stroke="#D9D2C4" stroke-width="1.5" rx="6"/>
    <text x="14" y="26" font-family="'PingFang SC',sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">贪狼 · 薪</text>
    <text x="14" y="43" font-family="monospace" font-size="10" fill="#8A8478">#WRK-01 · 工作 × 沟通</text>

    <g transform="translate(135,225)" filter="url(#zx)">
      <!-- 身体：鼓胀的钱袋 -->
      <path d="M0 -108 C 52 -108, 84 -70, 84 -22 C 84 36, 52 78, 0 78 C -52 78, -84 36, -84 -22 C -84 -70, -52 -108, 0 -108 Z"
            fill="#B8933F" stroke="#0A0A0A" stroke-width="9" stroke-linejoin="round"/>
      <!-- 腹部亮块 -->
      <path d="M-38 -20 C -20 -50, 22 -52, 44 -24 C 30 6, -22 8, -38 -20 Z" fill="#D9B45C" opacity="0.65"/>

      <!-- 铜钱眼（一大小，尸兄式不对称） -->
      <g stroke="#0A0A0A" stroke-width="7">
        <circle cx="-32" cy="-42" r="25" fill="#F2F0E6"/>
        <circle cx="34" cy="-38" r="17" fill="#F2F0E6"/>
      </g>
      <!-- 方孔（铜钱特征） -->
      <rect x="-40" y="-50" width="16" height="16" fill="#0A0A0A"/>
      <rect x="28" y="-45" width="12" height="12" fill="#0A0A0A"/>
      <!-- 瞳孔（贪欲：向下看钱） -->
      <circle cx="-32" cy="-36" r="5" fill="#0A0A0A"/>
      <circle cx="34" cy="-32" r="4" fill="#0A0A0A"/>

      <!-- 嘴：锯齿尖牙 -->
      <path d="M-46 14 C -30 30, 30 32, 48 12 C 40 46, -38 48, -46 14 Z" fill="#2A0A0A" stroke="#0A0A0A" stroke-width="7" stroke-linejoin="round"/>
      <g fill="#F2F0E6" stroke="#0A0A0A" stroke-width="3">
        <path d="M-30 18 L-20 34 L-12 18 Z"/>
        <path d="M-6 20 L2 38 L10 20 Z"/>
        <path d="M18 19 L26 35 L34 18 Z"/>
      </g>
      <!-- 口水（黏液） -->
      <path d="M-24 44 C -22 60, -26 74, -20 84 C -16 92, -24 96, -18 100"
            fill="none" stroke="#0A0A0A" stroke-width="5" stroke-linecap="round"/>
      <path d="M-20 100 C -12 106, -22 112, -18 118" fill="none" stroke="#0A0A0A" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="-18" cy="122" rx="7" ry="10" fill="url(#slime)" stroke="#0A0A0A" stroke-width="3.5"/>

      <!-- 贪狼小角 -->
      <path d="M-46 -96 C -58 -118, -44 -132, -30 -120" fill="none" stroke="#0A0A0A" stroke-width="8" stroke-linecap="round"/>
      <path d="M46 -96 C 58 -118, 44 -132, 30 -120" fill="none" stroke="#0A0A0A" stroke-width="8" stroke-linecap="round"/>

      <!-- 细长手爪抓硬币 -->
      <path d="M-84 -14 C -108 -18, -118 2, -108 20" fill="none" stroke="#0A0A0A" stroke-width="7" stroke-linecap="round"/>
      <path d="M84 -14 C 108 -18, 118 2, 108 20" fill="none" stroke="#0A0A0A" stroke-width="7" stroke-linecap="round"/>
      <circle cx="-110" cy="28" r="14" fill="#D9B45C" stroke="#0A0A0A" stroke-width="5"/>
      <rect x="-115" y="23" width="10" height="10" fill="#0A0A0A"/>
      <circle cx="110" cy="28" r="14" fill="#D9B45C" stroke="#0A0A0A" stroke-width="5"/>
      <rect x="105" y="23" width="10" height="10" fill="#0A0A0A"/>

      <!-- 胸口裂纹（贪婪的裂缝） -->
      <path d="M-8 -6 L4 14 L-6 30 L6 44" fill="none" stroke="#0A0A0A" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
    </g>

    <text x="135" y="380" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="11" fill="#5A5A5A">谈薪 · 跟老板要资源 · 拒绝加班</text>
  </g>

  <!-- ══════════════ 2. 浑沌·怠 ══════════════ -->
  <g transform="translate(315,80)">
    <rect x="0" y="0" width="270" height="410" fill="#FFFFFF" stroke="#D9D2C4" stroke-width="1.5" rx="6"/>
    <text x="14" y="26" font-family="'PingFang SC',sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">浑沌 · 怠</text>
    <text x="14" y="43" font-family="monospace" font-size="10" fill="#8A8478">#SEF-11 · 自我 × 模糊</text>

    <g transform="translate(135,225)" filter="url(#zx2)">
      <!-- 瘫软无定形的一团 -->
      <path d="M0 -96 C 46 -100, 78 -74, 88 -44 C 100 -8, 92 34, 74 56
               C 58 76, 26 84, -8 78 C -46 71, -76 52, -84 22
               C -92 -12, -74 -50, -46 -72 C -30 -84, -16 -94, 0 -96 Z"
            fill="#7A6B8A" stroke="#0A0A0A" stroke-width="9" stroke-linejoin="round"/>
      <!-- 瘫软的褶皱 -->
      <path d="M-52 -30 C -30 -44, 4 -40, 24 -26" fill="none" stroke="#0A0A0A" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
      <path d="M-40 12 C -18 2, 12 4, 34 16" fill="none" stroke="#0A0A0A" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
      <path d="M-24 44 C -6 36, 18 38, 36 46" fill="none" stroke="#0A0A0A" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>

      <!-- 眯成缝的眼（无力） -->
      <path d="M-46 -46 C -32 -56, -12 -54, -4 -46" fill="none" stroke="#0A0A0A" stroke-width="9" stroke-linecap="round"/>
      <path d="M14 -50 C 28 -58, 46 -54, 54 -44" fill="none" stroke="#0A0A0A" stroke-width="9" stroke-linecap="round"/>
      <!-- 无神的瞳孔（一线） -->
      <path d="M-24 -50 L-24 -44" stroke="#0A0A0A" stroke-width="5" stroke-linecap="round"/>
      <path d="M34 -50 L34 -44" stroke="#0A0A0A" stroke-width="5" stroke-linecap="round"/>

      <!-- 无力下垂的嘴 -->
      <path d="M-30 -6 C -14 6, 16 8, 32 -4" fill="none" stroke="#0A0A0A" stroke-width="8" stroke-linecap="round"/>
      <path d="M-22 -2 C -12 6, 8 8, 22 0" fill="none" stroke="#0A0A0A" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>

      <!-- 漂浮的问号（迷茫） -->
      <g fill="none" stroke="#D93025" stroke-width="7" stroke-linecap="round">
        <path d="M56 -84 C 66 -92, 78 -86, 74 -74 C 70 -64, 58 -66, 58 -56"/>
      </g>
      <circle cx="58" cy="-46" r="4.5" fill="#D93025"/>
      <g fill="none" stroke="#D93025" stroke-width="5" stroke-linecap="round" opacity="0.75">
        <path d="M-78 -74 C -88 -80, -96 -74, -92 -66 C -88 -58, -80 -60, -80 -52"/>
      </g>
      <circle cx="-80" cy="-44" r="3.5" fill="#D93025" opacity="0.75"/>

      <!-- 黏液滴落 -->
      <path d="M40 56 C 44 70, 38 80, 44 90" fill="none" stroke="#0A0A0A" stroke-width="4.5" stroke-linecap="round"/>
      <ellipse cx="44" cy="96" rx="6" ry="8" fill="url(#slime)" stroke="#0A0A0A" stroke-width="3"/>
      <path d="M-46 62 C -50 74, -44 82, -48 92" fill="none" stroke="#0A0A0A" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="-48" cy="98" rx="5" ry="7" fill="url(#slime)" stroke="#0A0A0A" stroke-width="3"/>

      <!-- 瘫软的四肢（软趴趴） -->
      <path d="M-84 24 C -102 34, -110 52, -100 66" fill="none" stroke="#0A0A0A" stroke-width="8" stroke-linecap="round"/>
      <path d="M84 30 C 100 42, 104 60, 92 72" fill="none" stroke="#0A0A0A" stroke-width="8" stroke-linecap="round"/>
    </g>

    <text x="135" y="380" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="11" fill="#5A5A5A">不知道自己想要什么 · 提不起劲</text>
  </g>

  <!-- ══════════════ 3. 拖延兽 ══════════════ -->
  <g transform="translate(600,80)">
    <rect x="0" y="0" width="270" height="410" fill="#FFFFFF" stroke="#D9D2C4" stroke-width="1.5" rx="6"/>
    <text x="14" y="26" font-family="'PingFang SC',sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">拖延兽</text>
    <text x="14" y="43" font-family="monospace" font-size="10" fill="#8A8478">#WRK-03 · 工作 × 执行</text>

    <g transform="translate(135,215)" filter="url(#zx)">
      <!-- 身体：变形的时钟 -->
      <path d="M0 -104 C 50 -104, 90 -66, 90 -14 C 90 40, 50 80, 0 80 C -50 80, -90 40, -90 -14 C -90 -66, -50 -104, 0 -104 Z"
            fill="#9A8B6A" stroke="#0A0A0A" stroke-width="9" stroke-linejoin="round"/>
      <!-- 钟面 -->
      <circle cx="0" cy="-14" r="62" fill="#E8DCC0" stroke="#0A0A0A" stroke-width="7"/>

      <!-- 断掉的指针（拖延：时间失效） -->
      <g stroke="#0A0A0A" stroke-linecap="round">
        <path d="M0 -14 L0 -58" stroke-width="8"/>
        <path d="M0 -14 L34 -6" stroke-width="8"/>
        <!-- 断裂处 -->
        <path d="M0 -58 L-14 -74" stroke-width="6"/>
        <path d="M34 -6 L58 4" stroke-width="6"/>
      </g>
      <circle cx="0" cy="-14" r="9" fill="#D93025" stroke="#0A0A0A" stroke-width="5"/>

      <!-- 刻度（歪斜） -->
      <g stroke="#0A0A0A" stroke-width="4" stroke-linecap="round" opacity="0.8">
        <path d="M0 -68 L0 -76"/><path d="M48 -48 L54 -54"/>
        <path d="M60 -14 L68 -14"/><path d="M48 20 L54 26"/>
        <path d="M-48 -48 L-54 -54"/><path d="M-60 -14 L-68 -14"/>
        <path d="M-48 20 L-54 26"/>
      </g>

      <!-- 眼：钟面上的两个破洞（一大一小） -->
      <g stroke="#0A0A0A" stroke-width="7">
        <circle cx="-30" cy="-56" r="16" fill="#2A0A0A"/>
        <circle cx="26" cy="-52" r="11" fill="#2A0A0A"/>
      </g>
      <circle cx="-30" cy="-52" r="5" fill="#F2F0E6"/>
      <circle cx="26" cy="-49" r="3.5" fill="#F2F0E6"/>

      <!-- 嘴：懒散的波浪 -->
      <path d="M-34 30 C -16 42, 16 44, 36 30" fill="none" stroke="#0A0A0A" stroke-width="8" stroke-linecap="round"/>
      <path d="M-26 36 C -12 44, 12 45, 26 36" fill="none" stroke="#0A0A0A" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>

      <!-- 锁链（被绑住） -->
      <g stroke="#0A0A0A" stroke-width="6" fill="none" stroke-linecap="round">
        <path d="M-90 -30 C -104 -20, -104 0, -92 10"/>
        <path d="M90 -30 C 104 -20, 104 0, 92 10"/>
        <path d="M-70 62 C -84 72, -84 88, -72 96"/>
        <path d="M70 62 C 84 72, 84 88, 72 96"/>
      </g>
      <g fill="none" stroke="#0A0A0A" stroke-width="5">
        <ellipse cx="-98" cy="-8" rx="8" ry="5"/>
        <ellipse cx="98" cy="-8" rx="8" ry="5"/>
        <ellipse cx="-78" cy="80" rx="7" ry="4.5"/>
        <ellipse cx="78" cy="80" rx="7" ry="4.5"/>
      </g>

      <!-- 黏液 -->
      <path d="M-30 44 C -32 60, -26 70, -32 78" fill="none" stroke="#0A0A0A" stroke-width="4.5" stroke-linecap="round"/>
      <ellipse cx="-32" cy="84" rx="6" ry="8" fill="url(#slime)" stroke="#0A0A0A" stroke-width="3"/>
      <path d="M28 42 C 30 56, 24 64, 30 72" fill="none" stroke="#0A0A0A" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="30" cy="78" rx="5" ry="7" fill="url(#slime)" stroke="#0A0A0A" stroke-width="3"/>
    </g>

    <text x="135" y="380" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="11" fill="#5A5A5A">知道该做什么，但就是推不动</text>
  </g>

  <!-- 风格说明 -->
  <rect x="30" y="504" width="840" height="42" rx="6" fill="#2E3A4A"/>
  <text x="46" y="524" font-family="'PingFang SC',sans-serif" font-size="11.5" fill="#F0D9A0" font-weight="600">画风执行要点</text>
  <text x="46" y="540" font-family="'PingFang SC',sans-serif" font-size="10.5" fill="#D8DCE2">
    轮廓 8–10pt 纯黑 · 线条必须抖动（feTurbulence + feDisplacementMap，scale 3–4.5）· 眼一大一小 · 局部红 #D93025 只做点缀 · 黏液黄绿 #A8C66C · 禁止可爱风与日系萌系
  </text>
</svg>
