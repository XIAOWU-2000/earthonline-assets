const nav = document.getElementById('nav');
const main = document.getElementById('main');
DOMAINS.forEach(([code,name])=>{
  const a=document.createElement('a');
  a.href='#'+code; a.textContent=name+' '+code;
  nav.appendChild(a);
});

DOMAINS.forEach(([code,dname])=>{
  const items = DATA.filter(r=>r.id.startsWith(code));
  const sec=document.createElement('section');
  sec.id=code;
  const done=items.length;
  sec.innerHTML = `<h2>${dname} <span style="color:var(--dim);font-weight:400">${code}</span>
    <span class="cnt">${done}/11</span>
    <span class="bar"><i style="width:${done/11*100}%"></i></span></h2>`;
  const grid=document.createElement('div');
  grid.className='grid';
  items.forEach(r=>{
    const d=document.createElement('div');
    d.className='card';
    d.innerHTML=`<div class="img"><img loading="lazy" src="thumbs/${r.file}" alt="${r.name}"></div>
      <div class="meta">
        <div class="nm">${r.name}</div>
        <div class="id">${r.id}</div>
        <div class="rs">${r.resist} · ${r.resist_mean}</div>
      </div>`;
    grid.appendChild(d);
  });
  sec.appendChild(grid);
  main.appendChild(sec);
});
