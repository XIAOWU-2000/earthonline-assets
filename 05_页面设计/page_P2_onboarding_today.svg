<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 940" width="1160" height="940" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title>页面设计稿 P2 · 建档收尾 + 今日页</title>
  <desc>时间/时辰/定盘问卷/今日页 · 代码道场风格</desc>

  <defs>
    <pattern id="rainP2" width="26" height="46" patternUnits="userSpaceOnUse">
      <g fill="#00FF41" font-size="11">
        <text x="2" y="12" opacity="0.13">☵</text><text x="2" y="26" opacity="0.08">☲</text>
        <text x="15" y="18" opacity="0.11">☰</text><text x="15" y="32" opacity="0.06">☶</text>
      </g>
    </pattern>
    <filter id="glowP2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1160" height="940" fill="#F7F5F0"/>
  <text x="28" y="34" font-size="19" font-weight="700" fill="#1A1A1A">页面设计稿 P2 · 建档收尾 + 今日页</text>
  <text x="28" y="56" font-size="11.5" fill="#8A8478">时辰的处理是建档的关键难点 —— 不知道的人必须能继续，不能被卡住</text>

  <!-- ════════ 屏 1 · 建档-时间 ════════ -->
  <g>
    <text x="28" y="88" font-size="12" font-weight="600" fill="#5A5142">④ 建档 · 时间（四柱已立）</text>
    <rect x="28" y="98" width="336" height="700" rx="16" fill="#05070A" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1.2"/>
    <line x1="28" y1="140" x2="364" y2="140" stroke="#00F0FF" stroke-opacity="0.2"/>
    <text x="48" y="126" font-family="monospace" font-size="10" fill="#00FF41">3/4 出生时间（已校正）</text>

    <text x="48" y="186" font-size="12" fill="#5A6472">出生时间</text>
    <rect x="48" y="200" width="296" height="56" rx="6" fill="#0C1016" stroke="#00F0FF" stroke-opacity="0.35"/>
    <text x="68" y="238" font-family="monospace" font-size="24" fill="#E8EDF5">10 : 56</text>
    <text x="200" y="238" font-size="11" fill="#00E5A0">✓ 巳时</text>
    <text x="48" y="278" font-size="10.5" fill="#00E5A0">✓ 已按真太阳时自动校正</text>

    <!-- 四柱 -->
    <text x="48" y="322" font-size="11" fill="#5A6472">三柱已立</text>
    <g transform="translate(48,336)">
      <g font-family="monospace">
        <rect x="0" y="0" width="68" height="72" rx="5" fill="#0C1016" stroke="#00F0FF" stroke-opacity="0.28"/>
        <text x="34" y="30" text-anchor="middle" font-size="17" fill="#E8EDF5">戊寅</text>
        <text x="34" y="52" text-anchor="middle" font-size="9" fill="#5A6472">年柱</text>
        <rect x="76" y="0" width="68" height="72" rx="5" fill="#0C1016" stroke="#00F0FF" stroke-opacity="0.28"/>
        <text x="110" y="30" text-anchor="middle" font-size="17" fill="#E8EDF5">丙辰</text>
        <text x="110" y="52" text-anchor="middle" font-size="9" fill="#5A6472">月柱</text>
        <rect x="152" y="0" width="68" height="72" rx="5" fill="#0C1016" stroke="#00F0FF" stroke-opacity="0.28"/>
        <text x="186" y="30" text-anchor="middle" font-size="17" fill="#E8EDF5">丁酉</text>
        <text x="186" y="52" text-anchor="middle" font-size="9" fill="#5A6472">日柱</text>
        <rect x="228" y="0" width="68" height="72" rx="5" fill="none" stroke="#2A3441" stroke-dasharray="4 3"/>
        <text x="262" y="30" text-anchor="middle" font-size="17" fill="#5A6472">?</text>
        <text x="262" y="52" text-anchor="middle" font-size="9" fill="#5A6472">时柱</text>
      </g>
    </g>
    <text x="48" y="440" font-size="12" fill="#E8EDF5">日主 <tspan font-weight="700" fill="#00F0FF">丁火</tspan></text>

    <g transform="translate(48,470)">
      <rect x="0" y="0" width="296" height="5" rx="2.5" fill="#141A23"/>
      <rect x="0" y="0" width="222" height="5" rx="2.5" fill="#00F0FF" filter="url(#glowP2)"/>
    </g>
    <text x="48" y="500" font-family="monospace" font-size="9" fill="#5A6472">已完成 3/4</text>

    <rect x="48" y="600" width="296" height="48" rx="6" fill="#00F0FF" filter="url(#glowP2)"/>
    <text x="196" y="630" text-anchor="middle" font-size="14" font-weight="700" fill="#05070A">下一步</text>
  </g>

  <!-- ════════ 屏 2 · 建档-时辰（含定盘问卷入口）════════ -->
  <g>
    <text x="404" y="88" font-size="12" font-weight="600" fill="#5A5142">⑤ 建档 · 时辰（不知道怎么办）</text>
    <rect x="404" y="98" width="336" height="700" rx="16" fill="#05070A" stroke="#FF003C" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="404" y1="140" x2="740" y2="140" stroke="#FF003C" stroke-opacity="0.2"/>
    <text x="424" y="126" font-family="monospace" font-size="10" fill="#FF3B30">4/4 时辰</text>

    <text x="424" y="186" font-size="12" fill="#5A6472">你的出生时辰</text>

    <!-- 选中态：巳时 -->
    <rect x="424" y="200" width="296" height="46" rx="6" fill="#0A1A18" stroke="#00E5A0" stroke-width="1.6"/>
    <text x="446" y="229" font-size="14" fill="#E8EDF5">巳时（09:00–11:00）</text>
    <text x="676" y="229" font-size="12" fill="#00E5A0">✓</text>

    <!-- ★ 不知道入口（虚线弱化） -->
    <rect x="424" y="258" width="296" height="46" rx="6" fill="none" stroke="#5A6472" stroke-dasharray="5 3"/>
    <text x="446" y="287" font-size="13" fill="#9AA5B4">我不知道时辰</text>
    <text x="676" y="287" font-size="14" fill="#5A6472">→</text>

    <!-- 十二时辰网格 -->
    <text x="424" y="336" font-size="11" fill="#5A6472">或直接选</text>
    <g transform="translate(424,346)" font-size="9.5">
      <g fill="#0C1016" stroke="#2A3441">
        <rect x="0" y="0" width="70" height="34" rx="4"/><rect x="76" y="0" width="70" height="34" rx="4"/>
        <rect x="152" y="0" width="70" height="34" rx="4"/><rect x="228" y="0" width="68" height="34" rx="4"/>
        <rect x="0" y="40" width="70" height="34" rx="4"/><rect x="76" y="40" width="70" height="34" rx="4"/>
        <rect x="152" y="40" width="70" height="34" rx="4"/><rect x="228" y="40" width="68" height="34" rx="4"/>
      </g>
      <g fill="#9AA5B4">
        <text x="35" y="21" text-anchor="middle">子 23-1</text><text x="111" y="21" text-anchor="middle">丑 1-3</text>
        <text x="187" y="21" text-anchor="middle">寅 3-5</text><text x="262" y="21" text-anchor="middle">卯 5-7</text>
        <text x="35" y="61" text-anchor="middle">辰 7-9</text><text x="111" y="61" text-anchor="middle">巳 9-11</text>
        <text x="187" y="61" text-anchor="middle">午 11-13</text><text x="262" y="61" text-anchor="middle">未 13-15</text>
      </g>
    </g>

    <!-- ★ 点"不知道"后：定盘问卷 -->
    <rect x="424" y="452" width="296" height="170" rx="8" fill="#14060A" stroke="#FF003C" stroke-opacity="0.4"/>
    <text x="444" y="478" font-size="10.5" font-weight="700" fill="#FF3B30">选「不知道」→ 进入定盘问卷</text>
    <text x="444" y="500" font-size="10" fill="#E8EDF5">用过去的大事反推时辰，至少 3 条</text>
    <g font-size="9">
      <rect x="444" y="512" width="86" height="22" rx="3" fill="#0C1016" stroke="#2A3441"/>
      <text x="487" y="527" text-anchor="middle" fill="#9AA5B4">升学年份</text>
      <rect x="538" y="512" width="86" height="22" rx="3" fill="#0C1016" stroke="#2A3441"/>
      <text x="581" y="527" text-anchor="middle" fill="#9AA5B4">工作变动</text>
      <rect x="444" y="540" width="86" height="22" rx="3" fill="#0C1016" stroke="#2A3441"/>
      <text x="487" y="555" text-anchor="middle" fill="#9AA5B4">婚恋</text>
      <rect x="538" y="540" width="86" height="22" rx="3" fill="#0C1016" stroke="#2A3441"/>
      <text x="581" y="555" text-anchor="middle" fill="#9AA5B4">病灾</text>
      <rect x="444" y="568" width="86" height="22" rx="3" fill="#0C1016" stroke="#2A3441"/>
      <text x="487" y="583" text-anchor="middle" fill="#9AA5B4">生育</text>
      <rect x="538" y="568" width="86" height="22" rx="3" fill="#0C1016" stroke="#2A3441"/>
      <text x="581" y="583" text-anchor="middle" fill="#9AA5B4">迁居</text>
    </g>
    <text x="444" y="610" font-size="9" fill="#C0605A">结果标注「推算时辰，非实证」，不假装精确</text>

    <rect x="424" y="640" width="296" height="42" rx="6" fill="#00F0FF" filter="url(#glowP2)"/>
    <text x="572" y="667" text-anchor="middle" font-size="13" font-weight="700" fill="#05070A">完成建档</text>
  </g>

  <!-- ════════ 屏 3 · 今日页 ════════ -->
  <g>
    <text x="780" y="88" font-size="12" font-weight="600" fill="#5A5142">⑥ 今日页（每日推演只展示一次）</text>
    <rect x="780" y="98" width="336" height="700" rx="16" fill="#05070A" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1.2"/>
    <rect x="780" y="98" width="336" height="700" rx="16" fill="url(#rainP2)" opacity="0.4"/>
    <line x1="780" y1="140" x2="1116" y2="140" stroke="#00F0FF" stroke-opacity="0.2"/>
    <text x="800" y="126" font-family="monospace" font-size="10" fill="#00FF41">今日 · 9月3日</text>
    <text x="1096" y="126" text-anchor="end" font-family="monospace" font-size="8" fill="#5A6472">丙午·庚申·戊戌</text>

    <!-- 今日状态 -->
    <text x="800" y="182" font-size="11" fill="#5A6472">今日状态</text>
    <rect x="800" y="192" width="296" height="6" rx="3" fill="#141A23"/>
    <rect x="800" y="192" width="216" height="6" rx="3" fill="#00E5A0" filter="url(#glowP2)"/>
    <text x="800" y="226" font-size="17" font-weight="700" fill="#00E5A0">阻力较小</text>
    <text x="800" y="248" font-size="11" fill="#9AA5B4">推进新事的阻力比昨天小</text>
    <text x="800" y="272" font-family="monospace" font-size="9.5" fill="#00F0FF">▸ 查看依据</text>

    <!-- 今日之劫 -->
    <text x="800" y="312" font-size="11" fill="#5A6472">今日之劫</text>
    <path d="M800 324 L1096 324 L1096 392 L1086 402 L800 402 L810 392 Z" fill="#0C1016" stroke="#FF003C" stroke-opacity="0.5" stroke-width="1.2"/>
    <g stroke="#FF003C" stroke-width="1.4" fill="none" stroke-opacity="0.6">
      <path d="M808 334 L808 329 L814 329"/><path d="M1088 329 L1094 329 L1094 335"/>
    </g>
    <text x="820" y="344" font-family="monospace" font-size="8" fill="#FF003C">#WRK-01</text>
    <text x="820" y="366" font-size="15" font-weight="700" fill="#E8EDF5">贪狼·薪</text>
    <text x="820" y="386" font-size="10" fill="#9AA5B4">和老板谈涨薪 · 已拖 12 天</text>
    <rect x="1030" y="352" width="58" height="22" rx="4" fill="none" stroke="#00F0FF" stroke-opacity="0.6"/>
    <text x="1059" y="367" text-anchor="middle" font-size="9.5" fill="#00F0FF">去推进</text>

    <!-- 已结算 -->
    <text x="800" y="440" font-size="11" fill="#5A6472">今日已结算</text>
    <text x="800" y="464" font-size="11" fill="#5A6472">· 整理季度数据</text>
    <text x="800" y="484" font-size="9.5" fill="#00E5A0">  ✓ 已完成 14:20</text>

    <!-- 算力 -->
    <text x="800" y="530" font-size="11" fill="#5A6472">算力</text>
    <text x="1096" y="530" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#E8EDF5">95/95</text>
    <rect x="800" y="540" width="296" height="5" rx="2.5" fill="#141A23"/>
    <rect x="800" y="540" width="296" height="5" rx="2.5" fill="#00F0FF" filter="url(#glowP2)"/>

    <!-- 底部导航 -->
    <line x1="800" y1="712" x2="1116" y2="712" stroke="#00F0FF" stroke-opacity="0.2"/>
    <g fill="none" stroke="#2A3441" stroke-width="1.4">
      <rect x="810" y="726" width="26" height="26" rx="5"/>
      <rect x="852" y="726" width="26" height="26" rx="5"/>
      <rect x="964" y="726" width="26" height="26" rx="5"/>
      <rect x="1006" y="726" width="26" height="26" rx="5"/>
    </g>
    <circle cx="948" cy="734" r="21" fill="#00F0FF" filter="url(#glowP2)"/>
    <text x="948" y="742" text-anchor="middle" font-size="26" font-weight="700" fill="#05070A">+</text>
    <text x="948" y="784" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#3A4451">每日推演只展示一次 · 重复打开不重复弹</text>
  </g>

  <!-- 底部说明 -->
  <rect x="28" y="828" width="1104" height="92" rx="8" fill="#2E3A4A"/>
  <text x="50" y="854" font-size="12" font-weight="700" fill="#F0D9A0">设计要点</text>
  <text x="50" y="878" font-size="11" fill="#D8DCE2">· 「我不知道时辰」用虚线弱化 —— 它是出口，不能看起来像失败</text>
  <text x="50" y="898" font-size="11" fill="#D8DCE2">· 定盘问卷必须凑够 3 条才出结果，且结果标注「非实证」</text>
  <text x="580" y="878" font-size="11" fill="#D8DCE2">· 今日页的劫卡用红色描边（#FF003C），与青色的「可操作」区分</text>
  <text x="580" y="898" font-size="11" fill="#F0D9A0">· 算力条满格用青色，是当前唯一满值的资源，视觉上给安全感</text>
</svg>