<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 940" width="1160" height="940" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title>页面设计稿 P1 · 启动 + 建档流程</title>
  <desc>代码道场风格高保真页面 · 启动页 · 建档四步</desc>

  <defs>
    <!-- 卦象代码雨 -->
    <pattern id="rainP1" width="26" height="46" patternUnits="userSpaceOnUse">
      <g fill="#00FF41" font-size="11">
        <text x="2" y="12" opacity="0.16">☵</text><text x="2" y="26" opacity="0.10">☲</text>
        <text x="2" y="40" opacity="0.055">☷</text><text x="15" y="18" opacity="0.13">☰</text>
        <text x="15" y="32" opacity="0.08">☶</text><text x="15" y="46" opacity="0.04">☴</text>
      </g>
    </pattern>
    <pattern id="gridP1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 0 L20 0 L20 20" fill="none" stroke="#00F0FF" stroke-width="0.4" opacity="0.07"/>
    </pattern>
    <filter id="glowP1" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1160" height="940" fill="#F7F5F0"/>
  <text x="28" y="34" font-size="19" font-weight="700" fill="#1A1A1A">页面设计稿 P1 · 启动 + 建档流程</text>
  <text x="28" y="56" font-size="11.5" fill="#8A8478">代码道场风格 · 建档每一步都给用户一个「他原本不知道的事实」</text>

  <!-- ════════ 屏 1 · 启动 ════════ -->
  <g>
    <text x="28" y="88" font-size="12" font-weight="600" fill="#5A5142">① 启动页（1.12s）</text>
    <rect x="28" y="98" width="336" height="700" rx="16" fill="#05070A" stroke="#00F0FF" stroke-opacity="0.35" stroke-width="1.3"/>
    <rect x="28" y="98" width="336" height="700" rx="16" fill="url(#rainP1)"/>
    <rect x="28" y="98" width="336" height="700" rx="16" fill="url(#gridP1)"/>

    <!-- Logo -->
    <g transform="translate(196,380)" filter="url(#glowP1)">
      <rect x="-72" y="-72" width="144" height="144" rx="10" fill="none" stroke="#00F0FF" stroke-width="2" opacity="0.85"/>
      <g stroke="#00FF41" stroke-width="2.5" opacity="0.5">
        <path d="M-104 -72 h32 M-104 -72 v32 M104 72 h-32 M104 72 v-32"/>
      </g>
      <!-- 卦象 ☵ 坎 -->
      <g fill="#E8EDF5">
        <rect x="-38" y="-30" width="32" height="9"/><rect x="6" y="-30" width="32" height="9"/>
        <rect x="-38" y="-4" width="76" height="9"/>
        <rect x="-38" y="22" width="32" height="9"/><rect x="6" y="22" width="32" height="9"/>
      </g>
      <text x="0" y="118" text-anchor="middle" font-size="17" font-weight="700" fill="#00F0FF" font-family="monospace">地球Online</text>
      <text x="0" y="144" text-anchor="middle" font-size="11" fill="#00FF41">中国服</text>
      <text x="0" y="176" text-anchor="middle" font-size="10" fill="#5A6472">让每件难事，都有个开局</text>
    </g>

    <text x="196" y="742" text-anchor="middle" font-family="monospace" font-size="9" fill="#3A4451">代码雨 fade in 560ms → Logo 320ms → glitch 80ms</text>
    <text x="196" y="762" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#3A4451">总时长 1.12s</text>
  </g>

  <!-- ════════ 屏 2 · 建档-出生日期 ════════ -->
  <g>
    <text x="404" y="88" font-size="12" font-weight="600" fill="#5A5142">② 建档 · 出生日期（给出节气）</text>
    <rect x="404" y="98" width="336" height="700" rx="16" fill="#05070A" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1.2"/>
    <line x1="404" y1="140" x2="740" y2="140" stroke="#00F0FF" stroke-opacity="0.2"/>
    <text x="424" y="126" font-family="monospace" font-size="10" fill="#00FF41">1/4 出生日期</text>

    <text x="424" y="186" font-size="12" fill="#5A6472">你的出生日期</text>
    <!-- 日期输入 -->
    <rect x="424" y="200" width="296" height="56" rx="6" fill="#0C1016" stroke="#00F0FF" stroke-opacity="0.35"/>
    <text x="444" y="238" font-family="monospace" font-size="22" fill="#E8EDF5">1998 − 04 − 20</text>
    <!-- 公历/农历切换 -->
    <g font-size="10">
      <rect x="424" y="268" width="60" height="24" rx="4" fill="#00F0FF"/>
      <text x="454" y="284" text-anchor="middle" fill="#05070A" font-weight="700">公历</text>
      <rect x="492" y="268" width="60" height="24" rx="4" fill="none" stroke="#2A3441"/>
      <text x="522" y="284" text-anchor="middle" fill="#5A6472">农历</text>
    </g>

    <!-- ★ 系统给的事实 -->
    <rect x="424" y="316" width="296" height="86" rx="8" fill="#0A1A18" stroke="#00E5A0" stroke-opacity="0.5"/>
    <text x="444" y="342" font-size="10" fill="#00E5A0">◆ 系统立刻告诉你</text>
    <text x="444" y="370" font-size="14" fill="#E8EDF5">你出生在 <tspan font-weight="700" fill="#00E5A0" font-size="16">谷雨</tspan> 后第 1 天</text>
    <text x="444" y="392" font-size="10.5" fill="#9AA5B4">雨生百谷 —— 是播种的时节</text>

    <text x="424" y="440" font-size="10" fill="#5A6472">这一步的价值：用户得到一个他原本不知道的节气</text>

    <!-- 进度条 -->
    <g transform="translate(424,470)">
      <rect x="0" y="0" width="296" height="5" rx="2.5" fill="#141A23"/>
      <rect x="0" y="0" width="74" height="5" rx="2.5" fill="#00F0FF" filter="url(#glowP1)"/>
    </g>
    <text x="424" y="500" font-family="monospace" font-size="9" fill="#5A6472">已完成 1/4</text>

    <!-- 按钮 -->
    <rect x="424" y="600" width="296" height="48" rx="6" fill="#00F0FF" filter="url(#glowP1)"/>
    <text x="572" y="630" text-anchor="middle" font-size="14" font-weight="700" fill="#05070A">下一步</text>
    <text x="572" y="676" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#3A4451">按压 scale 1.0→0.94 80ms → 回弹 200ms</text>
  </g>

  <!-- ════════ 屏 3 · 建档-出生地（真太阳时）════════ -->
  <g>
    <text x="780" y="88" font-size="12" font-weight="600" fill="#5A5142">③ 建档 · 出生地（真太阳时校正）★ 重点</text>
    <rect x="780" y="98" width="336" height="700" rx="16" fill="#05070A" stroke="#FCEE0A" stroke-opacity="0.45" stroke-width="1.4"/>
    <line x1="780" y1="140" x2="1116" y2="140" stroke="#FCEE0A" stroke-opacity="0.2"/>
    <text x="800" y="126" font-family="monospace" font-size="10" fill="#FCEE0A">2/4 出生地</text>

    <text x="800" y="186" font-size="12" fill="#5A6472">出生地</text>
    <rect x="800" y="200" width="296" height="48" rx="6" fill="#0C1016" stroke="#00F0FF" stroke-opacity="0.35"/>
    <text x="818" y="230" font-size="15" fill="#E8EDF5">四川省 · 成都市</text>
    <text x="800" y="272" font-family="monospace" font-size="9.5" fill="#5A6472">东经 104.07°</text>
    <text x="800" y="292" font-family="monospace" font-size="9.5" fill="#5A6472">钟表时间 12:00</text>

    <!-- ★ 真太阳时校正警示框 -->
    <rect x="800" y="316" width="296" height="132" rx="8" fill="#1A1206" stroke="#FCEE0A" stroke-opacity="0.55"/>
    <text x="818" y="342" font-size="10" font-weight="700" fill="#FCEE0A">⚠ 真太阳时校正</text>
    <text x="818" y="366" font-size="11" fill="#E8EDF5">成都比标准经度西偏 15.93°</text>
    <text x="818" y="386" font-size="11" fill="#E8EDF5">→ 需减去 <tspan font-weight="700" fill="#FCEE0A">64 分钟</tspan></text>

    <!-- 换算对比 -->
    <rect x="818" y="398" width="126" height="36" rx="4" fill="#020305"/>
    <text x="828" y="416" font-size="10.5" fill="#9AA5B4">12:00 →</text>
    <text x="828" y="430" font-family="monospace" font-size="10" fill="#5A6472">午时（你的理解）</text>
    <text x="1010" y="416" font-size="12" font-weight="700" fill="#FCEE0A">10:56</text>
    <text x="1010" y="430" font-size="12" font-weight="700" fill="#FCEE0A">巳时（实际）</text>
    <text x="818" y="452" font-size="10" fill="#FF6B60">时柱已改变</text>

    <!-- 开关 -->
    <text x="800" y="480" font-size="10" fill="#5A6472">默认开启，可关闭但会提示</text>
    <rect x="800" y="492" width="44" height="24" rx="12" fill="#00F0FF"/>
    <circle cx="832" cy="504" r="9" fill="#05070A"/>
    <text x="856" y="510" font-size="10.5" fill="#9AA5B4">已开启真太阳时校正</text>

    <!-- 进度 -->
    <g transform="translate(800,540)">
      <rect x="0" y="0" width="296" height="5" rx="2.5" fill="#141A23"/>
      <rect x="0" y="0" width="148" height="5" rx="2.5" fill="#00F0FF" filter="url(#glowP1)"/>
    </g>
    <text x="800" y="570" font-family="monospace" font-size="9" fill="#5A6472">已完成 2/4</text>

    <rect x="800" y="600" width="296" height="48" rx="6" fill="#00F0FF" filter="url(#glowP1)"/>
    <text x="948" y="630" text-anchor="middle" font-size="14" font-weight="700" fill="#05070A">下一步</text>
    <text x="948" y="676" text-anchor="middle" font-family="monospace" font-size="8" fill="#3A4451">这一步是全产品最强的「硬价值」——用户第一次知道自己的时辰可能不对</text>
  </g>

  <!-- 底部说明 -->
  <rect x="28" y="828" width="1104" height="92" rx="8" fill="#2E3A4A"/>
  <text x="50" y="854" font-size="12" font-weight="700" fill="#F0D9A0">设计要点</text>
  <text x="50" y="878" font-size="11" fill="#D8DCE2">· 建档不是"收信息"，是"每步给一个事实"——出生日期给节气、出生地给真太阳时校正</text>
  <text x="50" y="898" font-size="11" fill="#D8DCE2">· 真太阳时校正用黄色警示框（#FCEE0A），与青色主色区分，让"纠错"这件事有分量</text>
  <text x="580" y="878" font-size="11" fill="#D8DCE2">· 进度条用青色辉光，给用户"在推进"的实感</text>
  <text x="580" y="898" font-size="11" fill="#F0D9A0">· 第 3 步（时间）与第 4 步（时辰/定盘问卷）见下一张</text>
</svg>