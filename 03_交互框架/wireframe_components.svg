<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780">
  <title>线框与组件库 · 移动端 / PC / 组件状态</title>
  <desc>移动端三屏线框 · PC三栏线框 · 组件九态 · 栅格与间距令牌</desc>

  <rect width="900" height="780" fill="#F7F5F0"/>
  <text x="24" y="32" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#1A1A1A">线框与组件库</text>
  <text x="24" y="52" font-family="'PingFang SC',sans-serif" font-size="11" fill="#8A8478">线框用于结构与尺寸对齐；组件状态每个可交互元素都必须具备</text>

  <!-- ══════════ 移动端三屏 ══════════ -->
  <text x="24" y="80" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="600" fill="#5A5142">移动端（compact &lt;600dp）· 单列 + 底部导航 + 悬浮 +</text>

  <!-- 屏 1 今日 -->
  <g>
    <rect x="24" y="90" width="132" height="330" rx="14" fill="#FFFFFF" stroke="#B8B2A4" stroke-width="1.4"/>
    <text x="90" y="106" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="8.5" fill="#8A8478">P08 今日</text>
    <line x1="36" y1="112" x2="144" y2="112" stroke="#E0DCD2"/>

    <!-- 头部 -->
    <rect x="36" y="120" width="60" height="10" rx="2" fill="#3A3A3A"/>
    <rect x="36" y="136" width="44" height="6" rx="2" fill="#C8C4BA"/>

    <!-- 状态条 -->
    <rect x="36" y="154" width="36" height="6" rx="2" fill="#8A8478"/>
    <rect x="36" y="164" width="108" height="6" rx="3" fill="#E0DCD2"/>
    <rect x="36" y="164" width="78" height="6" rx="3" fill="#00E5A0"/>
    <rect x="36" y="178" width="52" height="9" rx="2" fill="#3A3A3A"/>

    <!-- 劫怪卡 -->
    <rect x="36" y="198" width="108" height="52" rx="4" fill="#FDF0EF" stroke="#FF003C" stroke-opacity="0.35"/>
    <rect x="44" y="206" width="34" height="6" rx="2" fill="#8A8478"/>
    <rect x="44" y="218" width="52" height="10" rx="2" fill="#2A2A2A"/>
    <rect x="44" y="234" width="70" height="6" rx="2" fill="#C8C4BA"/>
    <rect x="104" y="232" width="30" height="11" rx="2" fill="#00F0FF" opacity="0.35"/>

    <!-- 已结算 -->
    <rect x="36" y="262" width="40" height="6" rx="2" fill="#8A8478"/>
    <rect x="36" y="276" width="90" height="6" rx="2" fill="#D8D4CA"/>
    <rect x="36" y="288" width="76" height="6" rx="2" fill="#D8D4CA"/>

    <!-- 算力条 -->
    <rect x="36" y="306" width="30" height="5" rx="2" fill="#8A8478"/>
    <rect x="36" y="316" width="108" height="4" rx="2" fill="#E0DCD2"/>
    <rect x="36" y="316" width="86" height="4" rx="2" fill="#00F0FF"/>

    <!-- 底部导航 -->
    <line x1="36" y1="340" x2="144" y2="340" stroke="#E0DCD2"/>
    <g fill="#D8D4CA">
      <rect x="38" y="348" width="18" height="18" rx="3"/>
      <rect x="64" y="348" width="18" height="18" rx="3"/>
      <rect x="104" y="348" width="18" height="18" rx="3"/>
      <rect x="130" y="348" width="14" height="18" rx="3"/>
    </g>
    <!-- 悬浮 + -->
    <circle cx="90" cy="356" r="12" fill="#00F0FF"/>
    <text x="90" y="361" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#05070A">+</text>

    <text x="90" y="384" text-anchor="middle" font-family="monospace" font-size="7" fill="#8A8478">375×812</text>
    <text x="90" y="396" text-anchor="middle" font-family="monospace" font-size="7" fill="#8A8478">边距 12pt</text>
  </g>

  <!-- 屏 2 行动卡 -->
  <g>
    <rect x="168" y="90" width="132" height="330" rx="14" fill="#FFFFFF" stroke="#B8B2A4" stroke-width="1.4"/>
    <text x="234" y="106" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="8.5" fill="#8A8478">P10 行动卡</text>
    <line x1="180" y1="112" x2="288" y2="112" stroke="#E0DCD2"/>

    <rect x="180" y="120" width="20" height="7" rx="2" fill="#8A8478"/>
    <rect x="256" y="120" width="28" height="7" rx="2" fill="#C8C4BA"/>

    <rect x="180" y="136" width="72" height="11" rx="2" fill="#2A2A2A"/>
    <rect x="180" y="152" width="88" height="5" rx="2" fill="#C8C4BA"/>

    <!-- 步骤 -->
    <rect x="180" y="170" width="46" height="6" rx="2" fill="#00F0FF" opacity="0.6"/>
    <rect x="180" y="182" width="104" height="7" rx="2" fill="#3A3A3A"/>
    <rect x="188" y="194" width="56" height="5" rx="2" fill="#C8C4BA"/>

    <!-- 话术框 -->
    <rect x="180" y="210" width="46" height="6" rx="2" fill="#00F0FF" opacity="0.6"/>
    <rect x="180" y="220" width="104" height="42" rx="3" fill="#020305"/>
    <g fill="#E8EDF5" opacity="0.5">
      <rect x="188" y="228" width="88" height="5" rx="2"/>
      <rect x="188" y="238" width="82" height="5" rx="2"/>
      <rect x="188" y="248" width="70" height="5" rx="2"/>
    </g>

    <!-- 语气 chips -->
    <g>
      <rect x="180" y="268" width="30" height="14" rx="2" fill="#E8E4DA"/>
      <rect x="214" y="268" width="30" height="14" rx="2" fill="#00F0FF"/>
      <rect x="248" y="268" width="30" height="14" rx="2" fill="#E8E4DA"/>
    </g>

    <!-- 更小一步 -->
    <rect x="180" y="292" width="92" height="5" rx="2" fill="#C8C4BA"/>
    <rect x="180" y="302" width="64" height="7" rx="2" fill="#3A3A3A"/>

    <!-- 忌 -->
    <rect x="180" y="318" width="104" height="20" rx="3" fill="#FBF6E8" stroke="#F5C518" stroke-opacity="0.4"/>
    <rect x="186" y="324" width="60" height="5" rx="2" fill="#8A6D3B"/>

    <!-- 按钮 -->
    <rect x="180" y="346" width="50" height="24" rx="3" fill="#00F0FF"/>
    <rect x="234" y="346" width="50" height="24" rx="3" fill="none" stroke="#B8B2A4" stroke-dasharray="3 2"/>

    <text x="234" y="384" text-anchor="middle" font-family="monospace" font-size="7" fill="#8A8478">卡片内边距 12pt</text>
    <text x="234" y="396" text-anchor="middle" font-family="monospace" font-size="7" fill="#8A8478">区块间距 16pt</text>
  </g>

  <!-- 屏 3 应劫 -->
  <g>
    <rect x="312" y="90" width="132" height="330" rx="14" fill="#FFFFFF" stroke="#B8B2A4" stroke-width="1.4"/>
    <text x="378" y="106" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="8.5" fill="#8A8478">P11 应劫</text>
    <line x1="324" y1="112" x2="432" y2="112" stroke="#E0DCD2"/>

    <rect x="324" y="120" width="52" height="10" rx="2" fill="#2A2A2A"/>
    <rect x="324" y="136" width="72" height="5" rx="2" fill="#C8C4BA"/>

    <!-- 阻力条 -->
    <rect x="324" y="152" width="36" height="5" rx="2" fill="#8A8478"/>
    <rect x="324" y="162" width="104" height="6" rx="3" fill="#E0DCD2"/>
    <rect x="324" y="162" width="66" height="6" rx="3" fill="#FF003C"/>

    <!-- 手牌 扇形 -->
    <rect x="324" y="182" width="52" height="5" rx="2" fill="#8A8478"/>
    <g>
      <path d="M324 194 L354 194 L354 250 L348 256 L324 256 L330 250 Z" fill="#F0EDE5" stroke="#B8B2A4" transform="rotate(-6 339 225)"/>
      <path d="M360 190 L392 190 L392 254 L384 262 L360 262 L368 254 Z" fill="#E4F5EC" stroke="#00E5A0" stroke-width="1.4"/>
      <path d="M398 194 L428 194 L428 250 L422 256 L398 256 L404 250 Z" fill="#F0EDE5" stroke="#B8B2A4" transform="rotate(6 413 225)"/>
    </g>
    <text x="376" y="186" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="6.5" fill="#00E5A0">▲ 推荐</text>

    <!-- 提示 -->
    <rect x="324" y="272" width="86" height="5" rx="2" fill="#C8C4BA"/>
    <rect x="324" y="282" width="70" height="7" rx="2" fill="#00E5A0" opacity="0.7"/>

    <!-- 算力 -->
    <rect x="324" y="298" width="104" height="4" rx="2" fill="#E0DCD2"/>
    <rect x="324" y="298" width="60" height="4" rx="2" fill="#FF003C"/>

    <!-- 出牌按钮 -->
    <rect x="324" y="316" width="104" height="26" rx="3" fill="#00F0FF"/>
    <text x="376" y="333" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="8" font-weight="700" fill="#05070A">出牌 = 立刻行动</text>

    <text x="378" y="384" text-anchor="middle" font-family="monospace" font-size="7" fill="#8A8478">手牌 stagger 60ms</text>
    <text x="378" y="396" text-anchor="middle" font-family="monospace" font-size="7" fill="#8A8478">选中上移 12pt</text>
  </g>

  <!-- ══════════ PC 三栏 ══════════ -->
  <text x="468" y="80" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="600" fill="#5A5142">PC（expanded ≥840dp）· Rail + 列表 + 详情</text>

  <rect x="468" y="90" width="408" height="330" rx="8" fill="#FFFFFF" stroke="#B8B2A4" stroke-width="1.4"/>

  <!-- Rail -->
  <rect x="468" y="90" width="60" height="330" fill="#0C1016"/>
  <g fill="#2A3038">
    <rect x="480" y="106" width="36" height="36" rx="4"/>
    <rect x="480" y="150" width="36" height="36" rx="4"/>
    <rect x="480" y="194" width="36" height="36" rx="4"/>
    <rect x="480" y="238" width="36" height="36" rx="4"/>
  </g>
  <rect x="480" y="106" width="36" height="36" rx="4" fill="#00F0FF" opacity="0.28"/>
  <text x="498" y="330" font-family="monospace" font-size="7" fill="#5A6472">72pt</text>

  <!-- 列表栏 -->
  <line x1="528" y1="90" x2="528" y2="420" stroke="#E0DCD2"/>
  <rect x="536" y="104" width="76" height="10" rx="2" fill="#2A2A2A"/>
  <rect x="836" y="102" width="30" height="14" rx="3" fill="#00F0FF"/>

  <g>
    <rect x="536" y="126" width="300" height="46" rx="4" fill="#FDF0EF" stroke="#FF003C" stroke-opacity="0.3"/>
    <rect x="546" y="136" width="40" height="6" rx="2" fill="#8A8478"/>
    <rect x="546" y="148" width="72" height="9" rx="2" fill="#2A2A2A"/>
    <rect x="546" y="162" width="110" height="5" rx="2" fill="#C8C4BA"/>
    <rect x="790" y="146" width="34" height="12" rx="2" fill="#00F0FF" opacity="0.35"/>

    <rect x="536" y="180" width="300" height="46" rx="4" fill="#F4F2EC" stroke="#E0DCD2"/>
    <rect x="546" y="190" width="40" height="6" rx="2" fill="#8A8478"/>
    <rect x="546" y="202" width="64" height="9" rx="2" fill="#3A3A3A"/>
    <rect x="546" y="216" width="96" height="5" rx="2" fill="#C8C4BA"/>

    <rect x="536" y="234" width="300" height="46" rx="4" fill="#F4F2EC" stroke="#E0DCD2"/>
    <rect x="546" y="244" width="40" height="6" rx="2" fill="#8A8478"/>
    <rect x="546" y="256" width="58" height="9" rx="2" fill="#3A3A3A"/>
    <rect x="546" y="270" width="104" height="5" rx="2" fill="#C8C4BA"/>
  </g>
  <text x="686" y="300" text-anchor="middle" font-family="monospace" font-size="7" fill="#8A8478">列表栏 320pt</text>
  <text x="686" y="322" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="8" fill="#5A5A5A">hover 叠加 6% 白 · 右键上下文菜单</text>
  <text x="686" y="336" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="8" fill="#5A5A5A">Tab 焦点环 2pt cyan 外描边</text>

  <!-- 详情栏 -->
  <line x1="844" y1="90" x2="844" y2="420" stroke="#E0DCD2"/>
  <text x="852" y="200" font-family="'PingFang SC',sans-serif" font-size="9" fill="#8A8478">详情</text>
  <text x="852" y="216" font-family="'PingFang SC',sans-serif" font-size="9" fill="#8A8478">自适应</text>

  <text x="672" y="384" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="8" fill="#5A5A5A">PC 核心增益：今日之劫 + 行动卡 + 方剂依据 同屏</text>
  <text x="672" y="400" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="8" fill="#8A8478">（手机上这三步必须分屏跳转）</text>

  <!-- ══════════ 组件状态 ══════════ -->
  <text x="24" y="452" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="600" fill="#5A5142">组件状态 · 每个可交互元素都必须具备九态</text>

  <!-- 按钮五态 -->
  <g font-family="'PingFang SC',sans-serif" font-size="8" fill="#5A5A5A">
    <rect x="24" y="464" width="118" height="46" rx="4" fill="#00F0FF"/>
    <text x="83" y="486" text-anchor="middle" font-size="9" font-weight="700" fill="#05070A">Default</text>
    <text x="83" y="500" text-anchor="middle" font-size="7" fill="#05070A" opacity="0.7">#00F0FF</text>

    <rect x="150" y="464" width="118" height="46" rx="4" fill="#33F3FF"/>
    <rect x="150" y="464" width="118" height="46" rx="4" fill="#FFFFFF" opacity="0.06"/>
    <text x="209" y="486" text-anchor="middle" font-size="9" fill="#05070A">Hover（PC）</text>
    <text x="209" y="500" text-anchor="middle" font-size="7" fill="#05070A" opacity="0.7">叠加 6% 白</text>

    <rect x="276" y="466" width="114" height="42" rx="4" fill="#00D8E6"/>
    <text x="333" y="486" text-anchor="middle" font-size="9" fill="#05070A">Pressed</text>
    <text x="333" y="500" text-anchor="middle" font-size="7" fill="#05070A" opacity="0.7">缩放 0.97 / 120ms</text>

    <rect x="398" y="464" width="118" height="46" rx="4" fill="#00F0FF" stroke="#00F0FF" stroke-width="2"/>
    <rect x="394" y="460" width="126" height="54" rx="6" fill="none" stroke="#00F0FF" stroke-width="2"/>
    <text x="457" y="486" text-anchor="middle" font-size="9" fill="#05070A">Focused（PC）</text>
    <text x="457" y="500" text-anchor="middle" font-size="7" fill="#05070A" opacity="0.7">2pt cyan 外描边</text>

    <rect x="524" y="464" width="118" height="46" rx="4" fill="#00F0FF" opacity="0.4"/>
    <text x="583" y="486" text-anchor="middle" font-size="9" fill="#3A3A3A">Disabled</text>
    <text x="583" y="500" text-anchor="middle" font-size="7" fill="#5A5A5A">透明 40% · 禁动效</text>
  </g>

  <!-- Loading / Empty / Error -->
  <g font-family="'PingFang SC',sans-serif" font-size="8">
    <rect x="650" y="464" width="118" height="46" rx="4" fill="#141A23"/>
    <rect x="658" y="474" width="102" height="8" rx="4" fill="#1E2632"/>
    <rect x="658" y="488" width="76" height="8" rx="4" fill="#1E2632"/>
    <rect x="658" y="474" width="34" height="8" rx="4" fill="#2A3441"/>
    <text x="709" y="506" text-anchor="middle" font-size="7" fill="#9AA5B4">Loading 骨架屏（不用转圈）</text>

    <rect x="24" y="522" width="118" height="46" rx="4" fill="#FFFFFF" stroke="#E0DCD2"/>
    <circle cx="83" cy="538" r="9" fill="none" stroke="#C8C4BA" stroke-width="1.5"/>
    <path d="M79 538 L87 538 M83 534 L83 542" stroke="#C8C4BA" stroke-width="1.5"/>
    <text x="83" y="558" text-anchor="middle" font-size="7" fill="#8A8478">Empty</text>

    <rect x="150" y="522" width="118" height="46" rx="4" fill="#FDF0EF" stroke="#FF3B30" stroke-opacity="0.4"/>
    <circle cx="209" cy="538" r="8" fill="none" stroke="#FF3B30" stroke-width="1.6"/>
    <text x="209" y="542" text-anchor="middle" font-size="9" font-weight="700" fill="#FF3B30">!</text>
    <text x="209" y="558" text-anchor="middle" font-size="7" fill="#7A2E2A">Error · 说清怎么办</text>

    <rect x="276" y="522" width="118" height="46" rx="4" fill="#EDF3E6" stroke="#00E5A0" stroke-opacity="0.4"/>
    <path d="M325 534 L331 540 L340 528" fill="none" stroke="#00E5A0" stroke-width="2.4" stroke-linecap="round"/>
    <text x="333" y="558" text-anchor="middle" font-size="7" fill="#3D5230">Success</text>
  </g>

  <!-- 间距与栅格 -->
  <rect x="404" y="522" width="364" height="46" rx="4" fill="#FFFFFF" stroke="#E0DCD2"/>
  <text x="414" y="538" font-family="'PingFang SC',sans-serif" font-size="8" fill="#5A5142">间距令牌（4pt 基准）</text>
  <g font-family="monospace" font-size="7" fill="#8A8478">
    <rect x="414" y="544" width="4" height="12" fill="#00F0FF"/><text x="422" y="553">4</text>
    <rect x="440" y="544" width="8" height="12" fill="#00F0FF"/><text x="452" y="553">8</text>
    <rect x="470" y="544" width="12" height="12" fill="#00F0FF"/><text x="486" y="553">12</text>
    <rect x="504" y="544" width="16" height="12" fill="#00F0FF"/><text x="524" y="553">16</text>
    <rect x="542" y="544" width="24" height="12" fill="#00F0FF"/><text x="570" y="553">24</text>
    <rect x="586" y="544" width="32" height="12" fill="#00F0FF"/><text x="622" y="553">32</text>
    <text x="654" y="553">48</text>
    <text x="686" y="553">64</text>
  </g>
  <text x="730" y="553" font-family="'PingFang SC',sans-serif" font-size="7" fill="#B03A2E">组件内禁止硬编码数值</text>

  <!-- ══════════ 动效与降级 ══════════ -->
  <text x="24" y="596" font-family="'PingFang SC',sans-serif" font-size="12" font-weight="600" fill="#5A5142">动效令牌与降级</text>

  <g font-family="'PingFang SC',sans-serif" font-size="8.5">
    <rect x="24" y="606" width="240" height="30" rx="4" fill="#FFFFFF" stroke="#DDD8CC"/>
    <text x="34" y="625">fast 120ms　按压 · 切换</text>

    <rect x="272" y="606" width="240" height="30" rx="4" fill="#FFFFFF" stroke="#DDD8CC"/>
    <text x="282" y="625">base 200ms　展开 · 淡入 · 共享元素</text>

    <rect x="520" y="606" width="248" height="30" rx="4" fill="#FFFFFF" stroke="#DDD8CC"/>
    <text x="530" y="625">slow 320ms　转场 · 扇形展开</text>

    <rect x="24" y="644" width="240" height="30" rx="4" fill="#FFFFFF" stroke="#DDD8CC"/>
    <text x="34" y="663">glitch 80–150ms　同元素 2s 内最多 1 次</text>

    <rect x="272" y="644" width="240" height="30" rx="4" fill="#FFFFFF" stroke="#DDD8CC"/>
    <text x="282" y="663">扫描线 3–5%　可关闭（防闪烁敏感）</text>

    <rect x="520" y="644" width="248" height="30" rx="4" fill="#FFFFFF" stroke="#DDD8CC"/>
    <text x="530" y="663">辉光 双层 shadow　禁 BackdropFilter</text>
  </g>

  <!-- 降级表 -->
  <rect x="24" y="684" width="744" height="76" rx="6" fill="#05070A" stroke="#00F0FF" stroke-opacity="0.3"/>
  <text x="40" y="704" font-family="'PingFang SC',sans-serif" font-size="10" font-weight="700" fill="#00F0FF">VisualQuality 三级降级（帧率 &lt;50fps 自动降一级，设置可手动切）</text>
  <g font-family="'PingFang SC',sans-serif" font-size="9" fill="#E8EDF5">
    <text x="40" y="722">high　代码雨 + 扫描线 + 辉光 + 故障</text>
    <text x="40" y="738">medium　代码雨（列数减半）+ 辉光，无扫描线无故障</text>
    <text x="40" y="754">low　全静态，无动画无辉光，纯色板 —— <tspan fill="#F0D9A0">低端机必须能跑，功能完整</tspan></text>
  </g>
</svg>
