<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 660" width="240" height="660">
  <title>符箓 · 赛博霓虹（代码道场皮肤）— 上善若水</title>
  <desc>与朱砂黄纸版共用三段式结构与云篆笔画路径，仅换配色与表面处理。证明皮肤系统可换画风。</desc>

  <defs>
    <!-- 暗底网格 -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#080B10"/>
      <path d="M0 0 L20 0 L20 20" fill="none" stroke="#00F0FF" stroke-width="0.4" opacity="0.10"/>
    </pattern>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b1"/>
      <feGaussianBlur stdDeviation="6" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- ===== 底 ===== -->
  <rect x="8" y="8" width="224" height="644" fill="url(#grid)"/>
  <rect x="8" y="8" width="224" height="644" fill="none" stroke="#00F0FF" stroke-width="1.2" opacity="0.45"/>

  <!-- 斜切角（赛博几何） -->
  <path d="M232 8 L200 8 L232 40 Z" fill="#0C1016"/>
  <path d="M8 652 L8 620 L40 652 Z" fill="#0C1016"/>

  <!-- 外框 -->
  <rect x="20" y="20" width="200" height="620" fill="none" stroke="#00F0FF" stroke-width="1.4" opacity="0.35"/>
  <!-- 四角 L 形角标 -->
  <g stroke="#00F0FF" stroke-width="2" fill="none" opacity="0.7">
    <path d="M32 48 L32 32 L48 32"/>
    <path d="M192 32 L208 32 L208 48"/>
    <path d="M208 612 L208 628 L192 628"/>
    <path d="M48 628 L32 628 L32 612"/>
  </g>

  <!-- 扫描线 -->
  <g stroke="#E8EDF5" stroke-width="0.5" opacity="0.045">
    <path d="M20 40 H220 M20 60 H220 M20 80 H220 M20 100 H220 M20 120 H220 M20 140 H220 M20 160 H220 M20 180 H220 M20 200 H220 M20 220 H220 M20 240 H220 M20 260 H220 M20 280 H220 M20 300 H220 M20 320 H220 M20 340 H220 M20 360 H220 M20 380 H220 M20 400 H220 M20 420 H220 M20 440 H220 M20 460 H220 M20 480 H220 M20 500 H220 M20 520 H220 M20 540 H220 M20 560 H220 M20 580 H220 M20 600 H220 M20 620 H220"/>
  </g>

  <g filter="url(#rough2)">

    <!-- ============ 符头 · 三勾（霓虹化） ============ -->
    <g stroke="#00F0FF" fill="none" stroke-linecap="round" filter="url(#glow)">
      <path d="M62 66 C 88 50, 152 50, 178 66 C 150 62, 90 62, 62 66 Z" stroke-width="6"/>
      <path d="M60 84 C 88 68, 152 68, 180 84 C 150 79, 90 79, 60 84 Z" stroke-width="6"/>
      <path d="M58 102 C 88 86, 152 86, 182 102 C 150 96, 90 96, 58 102 Z" stroke-width="6"/>
    </g>
    <!-- 电路节点（替代传统圆点） -->
    <g fill="#00F0FF" filter="url(#glow)">
      <rect x="115" y="55" width="10" height="10"/>
      <rect x="115" y="103" width="10" height="8"/>
    </g>
    <path d="M120 60 L120 108" stroke="#00F0FF" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>

    <!-- ============ 符胆 · 云篆（同路径，霓虹描边） ============ -->
    <g stroke="#E8EDF5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">

      <!-- 【上】 -->
      <g stroke-width="5.5">
        <path d="M118 142 C 116 160, 122 178, 118 196"/>
        <path d="M84 168 C 96 162, 112 164, 120 166 C 132 169, 148 168, 156 162"/>
        <path d="M84 168 C 80 176, 84 184, 92 184 C 100 184, 104 178, 100 172"/>
        <path d="M152 172 C 148 166, 140 168, 140 176 C 140 184, 150 182, 148 174"/>
      </g>
      <path d="M92 200 C 100 208, 118 210, 130 202 C 138 196, 132 188, 124 192" stroke-width="2.6" opacity="0.7"/>

      <!-- 【善】 -->
      <g stroke-width="5.5">
        <path d="M76 232 C 88 224, 104 226, 112 230"/>
        <path d="M128 230 C 140 226, 156 224, 164 232"/>
        <path d="M120 228 L120 240"/>
        <path d="M92 248 C 108 244, 132 244, 148 248"/>
        <path d="M100 262 C 88 272, 92 290, 106 292 C 122 294, 132 282, 124 272 C 118 265, 104 270, 108 280"/>
        <path d="M140 262 C 152 272, 148 290, 134 292 C 118 294, 108 282, 116 272 C 122 265, 136 270, 132 280"/>
        <path d="M120 258 L120 300"/>
      </g>
      <path d="M96 306 C 110 312, 130 312, 144 306" stroke-width="3.4"/>

      <!-- 【若】 -->
      <g stroke-width="5.5">
        <path d="M98 330 C 92 342, 92 356, 96 366"/>
        <path d="M142 330 C 148 342, 148 356, 144 366"/>
        <path d="M86 336 C 100 330, 140 330, 154 336"/>
        <path d="M120 338 L120 352"/>
        <path d="M100 376 C 112 370, 128 372, 136 380 C 144 388, 136 400, 124 396 C 114 393, 116 382, 124 382"/>
        <path d="M96 392 C 106 404, 132 408, 146 398"/>
      </g>

      <!-- 【水】 -->
      <g stroke-width="6">
        <path d="M120 426 C 116 448, 124 470, 118 492"/>
      </g>
      <g stroke-width="4.5" stroke="#00F0FF" opacity="0.9">
        <path d="M120 440 C 108 446, 96 442, 92 432 C 88 422, 98 416, 104 424"/>
        <path d="M120 452 C 132 458, 146 454, 150 444 C 154 434, 142 428, 138 436"/>
        <path d="M120 470 C 106 476, 92 472, 88 462 C 84 452, 96 446, 102 454"/>
        <path d="M120 484 C 134 490, 148 486, 152 476 C 156 466, 144 460, 138 468"/>
      </g>
      <!-- 数据节点（替代墨点） -->
      <g fill="#00F0FF">
        <rect x="75" y="427" width="6" height="6"/>
        <rect x="159" y="453" width="6" height="6"/>
        <rect x="79" y="475" width="5" height="5"/>
      </g>
    </g>

    <!-- ============ 符脚 · 罡气（霓虹） ============ -->
    <g stroke="#FF3B30" fill="none" stroke-linecap="round" filter="url(#glow)">
      <path d="M120 522 C 120 538, 104 544, 96 556 C 88 568, 100 582, 116 578" stroke-width="5.5"/>
      <path d="M120 528 C 120 546, 136 550, 146 562 C 156 574, 142 588, 126 584" stroke-width="5.5"/>
      <path d="M96 596 C 108 588, 132 588, 144 596 C 132 606, 108 606, 96 596 Z" stroke-width="4"/>
      <path d="M104 596 C 112 592, 128 592, 136 596 C 128 600, 112 600, 104 596 Z" stroke-width="2.2"/>
      <path d="M120 606 C 118 616, 124 624, 120 632" stroke-width="4.5"/>
    </g>

    <g stroke="#FF3B30" fill="none" stroke-width="2" opacity="0.55" stroke-linecap="round">
      <path d="M74 540 C 84 534, 84 548, 74 552 C 64 556, 58 544, 66 538"/>
      <path d="M166 540 C 156 534, 156 548, 166 552 C 176 556, 182 544, 174 538"/>
    </g>

    <!-- ============ 法印（HUD 方块 + 卦象） ============ -->
    <g transform="translate(84,232)">
      <rect x="0" y="0" width="72" height="72" fill="#00F0FF" opacity="0.08"/>
      <rect x="0" y="0" width="72" height="72" fill="none" stroke="#00F0FF" stroke-width="2.5" opacity="0.8"/>
      <g stroke="#00F0FF" stroke-width="2" fill="none" opacity="0.9">
        <path d="M4 12 L4 4 L12 4"/><path d="M60 4 L68 4 L68 12"/>
        <path d="M68 60 L68 68 L60 68"/><path d="M12 68 L4 68 L4 60"/>
      </g>
      <g fill="#00F0FF" filter="url(#glow)">
        <rect x="18" y="20" width="14" height="5"/>
        <rect x="40" y="20" width="14" height="5"/>
        <rect x="18" y="33" width="36" height="5"/>
        <rect x="18" y="46" width="14" height="5"/>
        <rect x="40" y="46" width="14" height="5"/>
      </g>
    </g>

    <text x="120" y="326" text-anchor="middle" font-family="monospace" font-size="11" fill="#00F0FF" opacity="0.85">#023</text>

  </g>

  <text x="120" y="16" text-anchor="middle" font-family="monospace" font-size="8" fill="#00F0FF" opacity="0.5">CYBER · 赛博霓虹</text>
</svg>
